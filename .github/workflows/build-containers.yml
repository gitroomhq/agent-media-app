---
# Multi-arch container release to GHCR.
#
# Modelled on gitroomhq/postiz-app's build-containers workflow: build each arch
# on its own native runner (no slow QEMU emulation), push arch-tagged images,
# then merge them into one multi-arch manifest tagged with the release version
# and `latest`.
#
# Publishes one image per service:
#   ghcr.io/gitroomhq/agent-media-app/<service>:<tag>
#
# Trigger: push a git tag (e.g. v1.0.0), or run manually.

name: "Build Containers"

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/gitroomhq/agent-media-app

jobs:
  common:
    runs-on: ubuntu-latest
    outputs:
      containerver: ${{ steps.getcontainerver.outputs.containerver }}
    steps:
      - name: Get container version
        id: getcontainerver
        run: echo "containerver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  build:
    needs: common
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-v2
          - media-worker-v2
          - primitive-worker-vnext
          - subtitle-worker
          - brand-extractor
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.service }} (${{ matrix.arch }})
        env:
          CONTAINERVER: ${{ needs.common.outputs.containerver }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f services/${{ matrix.service }}/Dockerfile \
            --pull --provenance=false --sbom=false \
            --output "type=registry,name=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.CONTAINERVER }}-${{ matrix.arch }}" .

  manifest:
    needs: [build, common]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-v2
          - media-worker-v2
          - primitive-worker-vnext
          - subtitle-worker
          - brand-extractor
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Merge arch images into a multi-arch manifest
        env:
          CONTAINERVER: ${{ needs.common.outputs.containerver }}
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${IMAGE}:${CONTAINERVER}-amd64"
          docker buildx imagetools inspect "${IMAGE}:${CONTAINERVER}-arm64"

          docker manifest rm "${IMAGE}:${CONTAINERVER}" || true
          docker manifest rm "${IMAGE}:latest" || true

          docker manifest create "${IMAGE}:${CONTAINERVER}" \
            --amend "${IMAGE}:${CONTAINERVER}-amd64" \
            --amend "${IMAGE}:${CONTAINERVER}-arm64"
          docker manifest push "${IMAGE}:${CONTAINERVER}"

          docker manifest create "${IMAGE}:latest" \
            --amend "${IMAGE}:${CONTAINERVER}-amd64" \
            --amend "${IMAGE}:${CONTAINERVER}-arm64"
          docker manifest push "${IMAGE}:latest"

          docker manifest inspect "${IMAGE}:latest"
