# Expected failures for `@modelcontextprotocol/conformance server`.
#
# The server suite is written against the reference "everything" server: it
# calls fixture tools (test_simple_text, json_schema_2020_12_tool, …), reads
# fixture resources and prompts, and expects sampling/elicitation round trips.
# agent-media exposes seven product tools and no resources or prompts, so
# those scenarios cannot pass here and do not describe a defect.
#
# What MUST pass, and is not listed below: server-initialize, ping,
# tools-list, tools-call-simple-text, tools-call-error. A regression in any of
# those fails CI.
#
# server-sse-polling asks for a priming event and a retry field, which exist
# for resumable sessions. /mcp is stateless by design (one server per
# request, no session id), so there is nothing to resume.
#
# dns-rebinding-protection expects 4xx on a foreign Host header and only
# applies to localhost servers; production sits behind a real domain.
#
# server-sse-multiple-streams runs zero checks against a stateless server and
# reports a warning the CLI counts as a failure. GET /mcp does open a
# standalone SSE stream (HTTP 200, held open), which is what the spec allows.
server:
  - server-sse-multiple-streams
  - logging-set-level
  - completion-complete
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - json-schema-2020-12
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - server-sse-polling
  - resources-list
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-list
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
  - dns-rebinding-protection
