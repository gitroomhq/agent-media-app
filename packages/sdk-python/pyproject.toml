[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media"
version = "0.4.1"
description = "Python SDK for agent-media — generate AI UGC videos with talking heads, B-roll, and subtitles programmatically."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]
keywords = [
  "ugc", "video-generation", "ai", "sdk", "api-client",
  "text-to-video", "talking-head", "developer-tools", "ai-video",
  "b-roll", "subtitles", "product-video", "product-ugc", "agent-media"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://agent-media.ai"
Documentation = "https://agent-media.ai/docs/api-reference"
Repository = "https://github.com/gitroomhq/agent-media"
Changelog = "https://agent-media.ai/docs/api-changelog"
"Bug Tracker" = "https://github.com/gitroomhq/agent-media/issues"
